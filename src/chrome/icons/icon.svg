<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <!-- la vidéo verticale (le « Short ») et son triangle de lecture -->
    <g id="short">
      <rect x="35" y="19" width="58" height="90" rx="15" fill="#fff"/>
      <path d="M54 46v36l30-18z" fill="#dc2626"/>
    </g>
    <!-- les deux moitiés, de part et d'autre de la coupe -->
    <clipPath id="top"><path d="M0 0H128V42L0 86z"/></clipPath>
    <clipPath id="bottom"><path d="M0 86L128 42V128H0z"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g transform="translate(0 -7)"><use href="#short" clip-path="url(#top)"/></g>
  <g transform="translate(0 7)"><use href="#short" clip-path="url(#bottom)"/></g>
</svg>
